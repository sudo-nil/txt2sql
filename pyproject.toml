[project]
name = "txt2sql"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "google-cloud-bigquery>=3.25.0",
    "google-genai>=1.0.0",
    "python-dotenv>=1.0.0",
    "streamlit>=1.40.0",
    "pyyaml>=6.0.2",
    "tabulate>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "eval"]
